<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Body Improvement Club · Hero assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,900&family=Cinzel:wght@600;800&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Tom's club page (28 Oct 2026). Building your character feels like an old-school RPG's character sheet: gold
   frames on a starry night, like Tom's skill tree poster. The result is the Hero app's System status screen
   (ios/Hunter/App/Theme.swift). Inspired by both, copied from neither: our own frames, fonts and art. */
:root {
  --void: #03050b; --deep: #070e1e; --glass: rgba(10, 23, 46, .72); --frame: #4dbaff; --frame-dim: rgba(77, 186, 255, .3);
  --ice: #b2e3ff; --text: #e1edff; --muted: #8796b3; --gold: #ffca57; --gold-dim: rgba(255, 202, 87, .35); --warn: #ff5568; --done: #5fedbb;
  --wide: "Archivo", "Arial Black", system-ui, sans-serif; --body: "Inter", -apple-system, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace; --rune: "Cinzel", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--void); color: var(--text); font: 16px/1.45 var(--body); }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 110% 55% at 50% 0%, rgba(77,130,255,.18), transparent 60%),
              radial-gradient(ellipse 80% 40% at 80% 100%, rgba(255,202,87,.06), transparent 70%); }
.motes { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.motes i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: var(--ice); animation: twinkle ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .1; } }
@media (prefers-reduced-motion: reduce) { .motes i { animation: none; } }
.app { position: relative; max-width: 30rem; margin: 0 auto; min-height: 100svh; display: flex; flex-direction: column;
  padding-block: max(14px, env(safe-area-inset-top, 0px)) 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font: 800 12px var(--rune); letter-spacing: .16em; color: var(--gold); }
.count { font: 500 12px var(--mono); color: var(--muted); }
.gauge { height: 6px; margin: 10px 0 4px; border: 1px solid var(--gold-dim); background: rgba(3,5,11,.8); }
.gauge > div { height: 100%; width: 0; background: linear-gradient(90deg, rgba(255,202,87,.45), var(--gold)); box-shadow: 0 0 8px rgba(255,202,87,.6); transition: width .3s ease; }
main { padding: 14px 0 0; display: flex; flex-direction: column; gap: 18px; }
.area { font: 500 11px var(--mono); letter-spacing: .16em; color: var(--gold); text-transform: uppercase; }
h1 { font: 800 25px/1.15 var(--rune); letter-spacing: .02em; margin: 4px 0 0; color: #f4e7c8; text-shadow: 0 0 16px rgba(255,202,87,.35); }
.sub { color: var(--muted); margin: 6px 0 0; }
.label { font: 500 12px var(--mono); color: var(--gold); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
.how { font: 400 13px/1.4 var(--body); color: var(--muted); margin: -2px 0 6px; }
.field { border: 1px solid var(--gold-dim); padding: 12px; background: rgba(3,5,11,.55); display: flex; align-items: center; gap: 10px; }
.field input, .field textarea { flex: 1; min-width: 0; width: 100%; background: none; border: 0; outline: 0; color: var(--text); font: 700 24px var(--mono); }
.field textarea { font: 400 17px var(--body); resize: none; min-height: 90px; }
.field .unit { font: 500 12px var(--mono); color: var(--muted); white-space: nowrap; }
.field:focus-within { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pair > * { min-width: 0; }
/* Character-sheet frame: a gold double border with small diamond corners. */
.sheet { position: relative; padding: 16px; border: 1px solid var(--gold-dim); outline: 1px solid rgba(255,202,87,.12); outline-offset: 3px;
  background: linear-gradient(rgba(14,18,34,.82), rgba(6,9,20,.9)); }
.sheet::before, .sheet::after { content: ""; position: absolute; width: 9px; height: 9px; background: var(--gold); transform: rotate(45deg); top: -5px; }
.sheet::before { left: -5px; } .sheet::after { right: -5px; }
.sheet h2 { font: 800 13px var(--rune); letter-spacing: .2em; color: var(--gold); margin: 0 0 10px; padding-bottom: 8px;
  border-bottom: 1px solid; border-image: linear-gradient(90deg, transparent, var(--gold-dim), transparent) 1; text-align: center; }
/* The System window, for the result. */
.win { position: relative; padding: 16px; background: linear-gradient(var(--glass), rgba(7,14,30,.88)); border: 1px solid rgba(77,186,255,.35);
  box-shadow: 0 0 22px rgba(77,186,255,.16); }
.win::before, .win::after { content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--frame); }
.win::before { top: -4px; left: -4px; border-right: 0; border-bottom: 0; }
.win::after { bottom: -4px; right: -4px; border-left: 0; border-top: 0; }
.win h2 { font: 900 12px var(--wide); font-stretch: 125%; letter-spacing: .25em; color: var(--frame); margin: 0 0 10px;
  padding-bottom: 10px; border-bottom: 1px solid; border-image: linear-gradient(90deg, rgba(77,186,255,.7), transparent) 1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 600 15px var(--body); color: var(--text); background: none; border: 1px solid var(--gold-dim); border-radius: 999px; padding: 8px 13px; cursor: pointer; }
.chip.on { border: 2px solid var(--gold); background: rgba(255,202,87,.16); padding: 7px 12px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.big { background: none; color: var(--text); border: 1px solid var(--gold-dim); padding: 18px 10px; font: 700 17px var(--body); cursor: pointer; min-height: 64px;
  display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.big small { font: 500 12px var(--mono); color: var(--muted); }
.big .ico { font-size: 30px; line-height: 1; }
.photo { display: block; max-height: 340px; max-width: 100%; margin: 0 auto; border: 1px solid var(--gold-dim); }
.btn-file { display: block; text-align: center; border: 1px solid var(--gold); color: var(--gold); padding: 14px; font: 600 16px var(--body); cursor: pointer; }
.btn-file input { display: none; }
.big.on { border: 2px solid var(--gold); background: rgba(255,202,87,.14); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; font: 700 17px var(--body); cursor: pointer; }
.toggle input { appearance: none; width: 52px; height: 32px; border-radius: 99px; background: #2a3448; position: relative; cursor: pointer; flex: none; transition: background .2s; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: left .2s; }
.toggle input:checked { background: var(--gold); }
.toggle input:checked::after { left: 23px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--gold-dim); }
.seg button { background: none; border: 0; color: var(--muted); padding: 10px; font: 600 15px var(--body); cursor: pointer; }
.seg button.on { background: rgba(255,202,87,.16); color: var(--text); }
.stepper { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font: 700 16px var(--mono); }
.stepper div { display: flex; border: 1px solid var(--gold-dim); }
.stepper button { width: 46px; height: 36px; background: none; border: 0; color: var(--text); font-size: 20px; cursor: pointer; }
.note { font: 500 12px/1.5 var(--mono); color: var(--muted); }
.gold { color: var(--gold); }
.review { display: grid; grid-template-columns: 7.5rem 1fr; gap: 6px 10px; font: 500 13px/1.45 var(--mono); }
.review dt { color: var(--muted); text-transform: uppercase; }
.review dd { margin: 0; white-space: pre-line; }
.err { border: 1px solid rgba(255,85,104,.6); color: var(--warn); padding: 10px; font: 500 13px var(--mono); }
nav.actions { display: flex; gap: 10px; padding: 22px 0 10px; }
nav.actions:empty { display: none; }
nav.actions button { flex: 1; padding: 15px 8px; font: 700 17px var(--body); cursor: pointer; border: 1px solid var(--gold-dim); background: var(--void); color: var(--muted); }
nav.actions button.go { background: var(--gold); color: #1a1405; border-color: var(--gold); }
nav.actions button.go:disabled { background: rgba(255,202,87,.22); border-color: transparent; color: rgba(3,5,11,.7); cursor: default; }
footer { margin-top: auto; padding: 14px 0 max(18px, env(safe-area-inset-bottom, 0px)); text-align: center; font: 500 11px/1.6 var(--mono); color: var(--muted); }
footer a { color: var(--ice); }
.preview { font: 500 12px var(--mono); color: var(--gold); border: 1px solid rgba(255,202,87,.5); padding: 8px 10px; }
.promise { font: 500 13px/1.5 var(--body); color: var(--text); border-left: 2px solid var(--gold); padding: 2px 0 2px 10px; }
/* Skill tree: a constellation like Tom's poster. */
.tree { display: block; width: 100%; height: auto; touch-action: manipulation; }
.tree .ln { stroke: rgba(178,227,255,.22); stroke-width: 2; }
.tree .ln.on { stroke: var(--ice); filter: drop-shadow(0 0 4px var(--frame)); }
.tree .nd { cursor: pointer; }
.tree .nd circle.dot { fill: #0b1428; stroke: rgba(178,227,255,.45); stroke-width: 2; transition: fill .2s; }
.tree .nd.on circle.dot { fill: var(--ice); stroke: #fff; filter: drop-shadow(0 0 8px var(--frame)); }
.tree .nd.locked { opacity: .38; }
.tree .nd text { fill: var(--text); font: 700 9.5px var(--body); text-anchor: middle; letter-spacing: .02em; pointer-events: none; }
.tree .nd.on text { fill: #fff; }
.tree .root circle { fill: var(--ice); filter: drop-shadow(0 0 10px var(--frame)); }
.picked { font: 500 13px/1.5 var(--body); color: var(--muted); text-align: center; min-height: 1.5em; }
/* Result */
.hex { width: 120px; height: 120px; margin: 10px auto 0; display: grid; place-items: center; font: 900 52px var(--wide); font-stretch: 125%; color: var(--ice);
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: radial-gradient(rgba(77,186,255,.35), var(--void)); text-shadow: 0 0 14px var(--frame); }
.hex.wait { color: var(--gold); background: radial-gradient(rgba(255,202,87,.35), var(--void)); text-shadow: 0 0 14px var(--gold); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { filter: brightness(1.35); } }
.stat { display: grid; grid-template-columns: 3.2rem 1fr auto auto; align-items: baseline; gap: 4px 10px; padding: 6px 0; }
.stat b { font: 900 15px var(--wide); font-stretch: 125%; }
.stat .nm { font: 500 12px var(--mono); color: var(--muted); }
.stat .rk { font: 900 13px var(--wide); font-stretch: 125%; color: var(--ice); }
.stat .val { font: 700 26px var(--mono); }
.stat .na { color: var(--muted); }
.bar { grid-column: 1 / -1; height: 6px; border: 1px solid var(--frame-dim); background: rgba(3,5,11,.8); }
.bar > div { height: 100%; background: linear-gradient(90deg, rgba(77,186,255,.5), var(--frame)); box-shadow: 0 0 6px var(--frame); }
.why { grid-column: 1 / -1; font: 400 13px/1.45 var(--body); color: var(--muted); white-space: pre-line; }
.next { grid-column: 1 / -1; font: 500 13px/1.45 var(--body); color: var(--gold); border-left: 2px solid var(--gold); padding: 2px 0 2px 8px; margin-top: 2px; }
.next b { font: 700 11px var(--mono); letter-spacing: .06em; margin-right: 6px; }
.rankline { text-align: center; font: 900 18px var(--wide); font-stretch: 125%; letter-spacing: .04em; }
.hero-img { display: block; width: 100%; border: 1px solid rgba(77,186,255,.5); }
.disc { padding: 12px 0; border-top: 1px solid rgba(77,186,255,.18); }
.disc:first-of-type { border-top: 0; padding-top: 2px; }
.disc .t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.disc .t b { font: 900 14px var(--wide); font-stretch: 125%; letter-spacing: .04em; }
.disc .t span { font: 500 12px var(--mono); color: var(--muted); }
.beltline { display: flex; align-items: center; gap: 12px; margin: 8px 0 4px; }
.belt { position: relative; flex: none; width: 120px; height: 20px; border-radius: 3px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18), 0 0 10px rgba(0,0,0,.4); }
.belt .tip { position: absolute; right: 12px; top: 0; bottom: 0; width: 34px; background: #111; display: flex; align-items: center; justify-content: space-evenly; padding: 0 3px; }
.belt .tip i { width: 3px; height: 14px; background: #fff; }
.belt.none { background: none; border: 1px dashed var(--muted); box-shadow: none; }
.beltname { font: 700 15px var(--body); }
.beltname small { display: block; font: 500 12px var(--mono); color: var(--muted); }
.draft { font: 500 11px var(--mono); color: var(--gold); }
.levelup { margin-top: 8px; border-left: 2px solid var(--gold); padding: 2px 0 2px 10px; }
.levelup .h { font: 700 11px var(--mono); letter-spacing: .06em; color: var(--gold); }
.levelup ul { list-style: none; margin: 4px 0 0; padding: 0; font: 400 14px/1.5 var(--body); }
.levelup li { display: grid; grid-template-columns: 1.3rem 1fr; }
.levelup li .y { grid-column: 2; font: 500 12px var(--mono); color: var(--muted); }
.levelup li.met { color: var(--done); }
.levelup li.not_answered { color: var(--muted); }
.maybe { margin-top: 6px; font: 500 13px/1.45 var(--body); color: var(--ice); }
.cta { display: block; text-align: center; text-decoration: none; padding: 15px 10px; font: 700 17px var(--body); background: var(--gold); color: #1a1405; border: 0; }
.cta.alt { background: none; color: var(--ice); border: 1px solid var(--frame); font-size: 15px; padding: 12px; }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rate .big { padding: 14px 6px; font-size: 15px; }
.btn { display: block; width: 100%; text-align: center; border: 1px solid var(--gold); color: var(--gold); background: none; padding: 14px; font: 600 16px var(--body); cursor: pointer; }
body.kb h1 { font-size: 19px; margin-top: 0; }
body.kb .sub { font-size: 14px; margin-top: 4px; }
body.kb main { gap: 12px; padding-top: 8px; }
body.kb footer { display: none; }
/* Selfie: the photo is shown as a canvas, and on a computer the camera's live view (mirrored, like a mirror). */
.photo { width: auto; height: auto; object-fit: contain; }
.cam { width: 100%; max-height: 60vh; transform: scaleX(-1); background: #000; }
button.btn-file { width: 100%; background: none; }
button.btn-file.go { background: var(--gold); color: #1a1405; }
/* "What's this?" for each movement. */
.lrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.lrow .label { margin-bottom: 0; }
.what { flex: none; font: 600 12px var(--body); color: var(--ice); background: none; border: 1px solid var(--frame-dim); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.what.on { border-color: var(--frame); background: rgba(77,186,255,.12); }
.demo { border: 1px solid var(--frame-dim); background: rgba(10,23,46,.6); padding: 10px 12px; margin: 0 0 8px; font: 400 14px/1.5 var(--body); }
.demo video { display: block; width: 100%; margin-bottom: 8px; background: #000; }
.demo .src { font: 500 11px/1.5 var(--mono); color: var(--muted); margin-top: 6px; }
/* Two columns on a computer. On a phone these wrappers vanish, so the phone layout is unchanged. */
.cols, .col { display: contents; }
@media (min-width: 900px) {
  .app { max-width: 66rem; padding-top: 26px; padding-left: 40px; padding-right: 40px; }
  main, nav.actions { width: 100%; max-width: 44rem; margin-left: auto; margin-right: auto; }
  main.wide { max-width: none; }
  main { gap: 22px; padding-top: 22px; }
  h1 { font-size: 34px; }
  .sub { font-size: 17px; }
  .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 36px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 22px; }
  .tree { max-height: 60vh; }
  .photo { max-height: 420px; }
  footer { padding-top: 28px; }
}
</style>
</head>
<body>
<div class="motes" id="motes" aria-hidden="true"></div>
<div class="app">
  <div class="top"><span class="brand">BODY IMPROVEMENT CLUB</span><span class="count" id="count"></span></div>
  <div class="gauge" aria-hidden="true"><div id="gauge"></div></div>
  <main id="main" aria-live="polite"></main>
  <nav class="actions" id="nav"></nav>
  <footer id="foot"></footer>
</div>
<script src="catalog.js"></script>
<script>
(function () {
  "use strict";
  // Same private Apps Script and one-time links as the hero page (business/demo-form). No link = preview mode.
  var ENDPOINT = "https://script.google.com/macros/s/AKfycbxQ6Q1wlhdCfulUkrFy5s0O0AaOgTHzVqmrI041qGEObuh-0-LXdc3r3a2hA9jnSKrsCg/exec";
  var C = window.HERO_CATALOG, K = C && C.club;
  var token = (new URLSearchParams(location.hash.slice(1))).get("t") || "";
  var preview = !ENDPOINT || !token;
  // Selfies need a face data release here (Luke, 28 Oct 2026): Tom is in Illinois, where a face map from a photo is
  // biometric data (BIPA). The person ticks "I agree" and types their full name as their signature.
  var s = { step: 0, name: "", adult: false, way: null, selfie: null, signedName: "", agreed: false, look: { extra: "" }, sex: null, shirt: null, muscle: null, note: "",
    skills: {}, tests: {}, demo: {}, cam: null, kbUnit: "kg", age: "", weight: "", hFt: "", hIn: "", pushups: "", pullups: "", runDist: "1_mile", runMin: "", runSec: "",
    lifts: {}, reps: {}, db: {}, jFt: "", jIn: "", skill: "", sk: { how_long: "", how_often: "", best: "" }, skipped: {},
    sending: false, error: "", done: false, checking: !!(ENDPOINT && token), result: null, avatar: null, fb: { rating: null, text: "", sent: false, sending: false } };

  // The club tests, grouped into screens. Each screen shows only the tests of skills that were ticked.
  var GROUPS = [
    { key: "pulling", area: "Strength · Pulling", title: "Pulling tests", sub: "Tom's Monkey belt: hangs, rows and the pull-up path.", base: "pullups",
      tests: ["dead_hang_s", "scap_pullups", "assisted_pullups", "knee_raises", "aus_rows", "aus_rows_flat", "leg_raises", "one_arm_hang_s",
        "hanging_l_sit_s", "skin_the_cat", "l_sit_chinups", "wide_pullups", "clapping_pullups", "one_arm_l_sit_s", "muscle_ups", "blue_circuit"] },
    { key: "pushing", area: "Strength · Pushing", title: "Pushing tests", sub: "Tom's Tiger belt: push-ups, planks and presses.", base: "pushups",
      tests: ["kneeling_pushups", "single_arm_plank_s", "db_press", "pike_pushups", "diamond_pushups", "wide_pushups", "lateral_raise", "one_arm_pushups"] },
    { key: "legs", area: "Strength · Legs", title: "Leg tests", sub: "Tom's Panda belt: squats, lunges and pistols.", tests: ["squats", "lunges", "calf_raises", "pistols"] },
    { key: "weighted", area: "Strength · Weighted", title: "Weighted calisthenics", sub: "Weight added on a belt or vest.", tests: ["weighted_pullup", "weighted_dip"] },
    { key: "kb", area: "Strength · Agility", title: "Kettlebell and mace", sub: "Your best set of each. The catch is a test of timing and grip, too.",
      tests: ["kb_swing", "goblet_squat", "kb_catch", "mace_360", "kb_press", "one_arm_swing", "hand_to_hand"] }
  ];
  var TEST = {}; (K ? K.tests : []).forEach(function (t) { TEST[t.key] = t; });
  function ticked(key) { return !!s.skills[key]; }
  // Yellow Belt tests and up (tier 2) appear once you reach Tom's White Belt test number, or tick Advanced Calisthenics,
  // so a beginner isn't asked about muscle-ups.
  function tier2Open(g) { return ticked("advanced_calisthenics") || (g && g.base && parseInt(s[g.base], 10) >= K.tier2_from[g.base]); }
  function asked(key) { var t = TEST[key]; return !!t && t.skills.some(ticked) && (t.tier < 2 || tier2Open(groupOf(key))); }
  function groupTests(g) { return g.tests.filter(asked); }

  function steps() {
    if (s.teen) { var t = ["teen", "tree", "strength"]; GROUPS.forEach(function (g) { if (groupTests(g).length) t.push(g.key); }); return t.concat(["review"]); }
    var out = ["start", "tree", "way", "consent", "capture", "body", "age", "weight", "height", "strength"];
    GROUPS.forEach(function (g) { if (groupTests(g).length) out.push(g.key); });
    if (ticked("weightlifting")) out.push("lifts");
    return out.concat(["run", "jump", "skill", "review"]);
  }
  var OPTIONAL = { weight: 1, height: 1, strength: 1, lifts: 1, run: 1, jump: 1, skill: 1, pulling: 1, pushing: 1, legs: 1, advanced: 1, weighted: 1, kb: 1 };

  // Stars, still and twinkling, like the night sky on Tom's poster.
  (function () { var m = document.getElementById("motes"); for (var i = 0; i < 46; i++) { var d = document.createElement("i");
    d.style.left = (Math.random() * 100) + "%"; d.style.top = (Math.random() * 100) + "%"; d.style.opacity = .15 + Math.random() * .5;
    d.style.animationDuration = (3 + Math.random() * 6) + "s"; d.style.animationDelay = (-Math.random() * 6) + "s"; m.appendChild(d); } })();

  (function () {
    var vv = window.visualViewport, full = window.innerHeight;
    if (!vv) return;
    vv.addEventListener("resize", function () {
      if (!document.activeElement || !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) full = Math.max(full, vv.height);
      var open = vv.height < full * 0.78;
      document.body.classList.toggle("kb", open);
      if (open) setTimeout(function () { var f = document.activeElement; if (f && /INPUT|TEXTAREA/.test(f.tagName)) f.scrollIntoView({ block: "center", behavior: "smooth" }); }, 60);
    });
  })();

    return h("div", { class: "win" }, [h("h2", { text: "HOW DID WE DO?" }),
      h("div", { class: "rate" }, [rb("spot_on", "Spot on"), rb("close", "Close"), rb("off", "Way off")]),
      h("div", { class: "field", style: "margin-top:10px;border-color:var(--frame-dim)" }, [ta]),
      s.error ? h("div", { class: "err", text: s.error }) : null,
      h("button", { type: "button", class: "btn", style: "margin-top:10px", text: f.sending ? "Sending…" : "Send feedback", onclick: sendFeedback })]);
  }

  function post(fields) {
    return fetch(ENDPOINT, { method: "POST", body: new URLSearchParams(Object.assign({ token: token }, fields)) }).then(function (r) { return r.json(); });
  }
  function sendFeedback() {
    var f = s.fb;
    if (!f.rating && !f.text.trim()) { s.error = "Pick a rating or write a comment."; render(); return; }
    if (preview) { f.sent = true; s.error = ""; render(); return; }
    f.sending = true; s.error = ""; render();
    post({ action: "feedback", rating: f.rating || "", text: f.text }).then(function (reply) {
      f.sending = false; if (reply && reply.ok) f.sent = true; else s.error = (reply && reply.error) || "That didn't send. Please try again."; render();
    }).catch(function () { f.sending = false; s.error = "That didn't send. Check your connection and try again."; render(); });
  }
  // Google's web app sometimes loses a reply with a picture in it (23 Oct 2026), so try a few times.
  function loadAvatar(n) {
    post({ action: "avatar" }).then(function (a) {
      if (a && a.ok && a.jpeg) { s.avatar = a.jpeg; render(); } else if (n < 5) setTimeout(function () { loadAvatar(n + 1); }, 4000);
    }).catch(function () { if (n < 5) setTimeout(function () { loadAvatar(n + 1); }, 4000); });
  }
  // A used link becomes the person's results page: check now, and every 30 s while they wait.
  function checkResult() {
    if (preview) return;
    post({ action: "result" }).then(function (reply) {
      var wasChecking = s.checking; s.checking = false;
      if (reply && reply.error && !reply.ok) { s.closed = reply.error; render(); return; }
      if (!reply || !reply.ok) { if (wasChecking) render(); return; }
      if (reply.result && !reply.result.held) {
        var first = !s.result; s.result = reply.result; s.done = true;
        if (reply.has_avatar && !s.avatar) loadAvatar(0);
        if (first) { render(); rerenderAtReady(); }
        if (!reply.has_avatar) setTimeout(checkResult, 30000);
      } else if (reply.submitted || reply.result) { var again = !s.done; s.done = true; render(); if (again) rerenderAtReady(); setTimeout(checkResult, 30000); }
      else if (wasChecking) render();
    }).catch(function () { if (s.checking) { s.checking = false; render(); } });
  }

  function footer() {
    var club = (s.result && s.result.club) || K || {};
    var f = document.getElementById("foot");
    // Fit is 18+, so the waitlist link shows only once someone says they're 18 or older (Luke, 28 Oct 2026).
    if (s.teen || !s.adult) { f.replaceChildren(h("div", { text: "Made with Hero Made Fit" })); return; }
    f.replaceChildren.apply(f, [h("div", {}, ["Made with Hero Made Fit · ", h("a", { href: club.waitlist_url || "https://heromadefit.com/", target: "_blank", rel: "noopener", text: "Join the Fit waitlist" })]),
      s.done ? h("div", {}, [h("a", { href: club.skool_url || "#", target: "_blank", rel: "noopener", text: "Tom's Body Improvement Club on Skool" })]) : null].filter(Boolean));
  }

  function render() {
    var main = document.getElementById("main"), all = steps();
    if (s.step >= all.length) s.step = all.length - 1;
    var st = all[s.step];
    main.className = (s.done ? !!s.result : GROUPS.some(function (g) { return g.key === st; }) || st === "lifts" || (st === "capture" && s.way === "describe" && !s.closed)) ? "wide" : "";
    main.replaceChildren.apply(main, (s.closed ? [head(null, "This link is closed", s.closed), h("p", { class: "note", text: "Ask Luke if you'd like a new one." })]
      : s.checking ? [head(null, "Opening your link…", "One moment.")] : s.done ? doneScreen() : screen()).filter(Boolean));
    document.getElementById("count").textContent = s.done ? "" : (s.step + 1) + " / " + all.length;
    document.getElementById("gauge").style.width = (s.done ? 100 : (s.step + 1) / all.length * 100) + "%";
    footer();
    bar();
  }

  function bar() {
    var nav = document.getElementById("nav"), st = steps()[s.step];
    if (s.done || s.checking || s.closed) { nav.replaceChildren(); return; }
    var kids = [];
    if (s.step > 0) kids.push(h("button", { type: "button", text: "Back", onclick: function () { go(-1); } }));
    if (OPTIONAL[st]) kids.push(h("button", { type: "button", text: "Skip", onclick: function () { s.skipped[st] = true; go(1); } }));
    var last = st === "review";
    kids.push(h("button", { type: "button", class: "go", text: last ? (s.sending ? "Sending…" : s.teen ? "Show my belts" : "Forge my hero") : st === "consent" && s.way === "selfie" ? "Agree and add my selfie" : "Next", disabled: !canGo() || s.sending,
      onclick: function () { if (last) send(); else { delete s.skipped[st]; go(1); } } }));
    nav.replaceChildren.apply(nav, kids);
  }

  function go(d) { stopCam(); s.error = ""; s.step = Math.max(0, Math.min(steps().length - 1, s.step + d)); render(); window.scrollTo(0, 0); }

  // Resize to at most 1600 px and re-encode as JPEG: smaller to send, and the photo's location data is dropped.
  // createImageBitmap decodes the file without an image URL, and the preview is the canvas itself, so this works under
  // a strict Content-Security-Policy too (the review server's img-src 'self' blocked the old blob: URL, 28 Oct 2026).
  function keepPhoto(src, w, ht) {
    var scale = Math.min(1, 1600 / Math.max(w, ht)), cv = document.createElement("canvas");
    cv.width = Math.round(w * scale); cv.height = Math.round(ht * scale);
    cv.getContext("2d").drawImage(src, 0, 0, cv.width, cv.height);
    var data = cv.toDataURL("image/jpeg", 0.85);
    cv.className = "photo"; cv.setAttribute("role", "img"); cv.setAttribute("aria-label", "Your selfie");
    s.selfie = { cv: cv, b64: data.split(",")[1] }; s.error = ""; render();
  }
  function toJpeg(file) {
    function bad() { s.error = "That photo couldn't be opened. Try another one."; render(); }
    function viaImage() {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () { URL.revokeObjectURL(url); keepPhoto(img, img.naturalWidth, img.naturalHeight); };
      img.onerror = function () { URL.revokeObjectURL(url); bad(); };
      img.src = url;
    }
    if (!window.createImageBitmap) { viaImage(); return; }
    createImageBitmap(file).then(function (b) { keepPhoto(b, b.width, b.height); if (b.close) b.close(); }, viaImage);
  }

  // The computer's camera (getUserMedia): a live view and a "Take photo" button. Phones keep the file input, which
  // opens their own camera app.
  function desktopCam() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && matchMedia("(hover: hover) and (pointer: fine)").matches; }
  function startCam() {
    s.error = "";
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false }).then(function (stream) {
      s.cam = stream; render();
    }, function (e) {
      s.error = e && e.name === "NotAllowedError" ? "The camera is blocked for this page. Allow it from your browser's address bar, or choose a photo instead." :
        "No camera could be opened. Choose a photo instead."; render();
    });
  }
  function stopCam() { if (s.cam) { s.cam.getTracks().forEach(function (t) { t.stop(); }); s.cam = null; } }
  function camScreen() {
    var v = s.camEl || (s.camEl = h("video", { class: "photo cam", autoplay: true, muted: true, playsinline: true, "aria-label": "Camera view" }));
    if (v.srcObject !== s.cam) v.srcObject = s.cam;
    var p = v.play && v.play(); if (p && p.catch) p.catch(function () {});
    return [head("Appearance", "Your selfie", "Face the camera in good light. Just you in the photo."), v,
      h("div", { class: "pair" }, [
        h("button", { type: "button", class: "btn-file go", text: "Take photo", onclick: function () {
          if (!v.videoWidth) return;
          var w = v.videoWidth, ht = v.videoHeight; keepPhoto(v, w, ht); stopCam(); render(); } }),
        h("button", { type: "button", class: "btn-file", style: "border-color:var(--frame-dim);color:var(--muted)", text: "Cancel", onclick: function () { stopCam(); render(); } })]),
      s.error ? h("div", { class: "err", text: s.error }) : null];
  }

  // --- Teen version (Luke, 28 Oct 2026): under 18, the belts are placed here on the phone with the same rules as
  // the Mac (club.place, via belts.js), and nothing is sent or kept.
  function startTeen() {
    s.teen = true; s.step = 0; s.adult = false; s.name = "";
    Object.keys(s.skills).forEach(function (k) { if (!allowed(k)) delete s.skills[k]; });
    if (!window.CLUB_BELTS) {
      var sc = document.createElement("script"); sc.src = "belts.js";
      sc.onload = render; sc.onerror = function () { s.error = "The teen version isn't available yet."; render(); };
      document.head.appendChild(sc);
    }
    render();
  }
  function teenValue(key, tests) {
    if (key === "pushups" || key === "pullups") { var v = parseInt(s[key], 10); return s.skipped.strength || isNaN(v) ? null : v; }
    return tests[key] == null ? null : tests[key];
  }
  function teenMet(v, need) { return Array.isArray(need) ? v.weight >= need[0] && v.reps >= need[1] : need === true ? v === true : v >= need; }
  function teenYours(key, v) {
    if (v == null) return null;
    if (v === true || v === false) return v ? "yes" : "no";
    var t = TEST[key];
    if (typeof v === "object") return v.reps + " × " + v.weight + " " + (t.unit || "kg").replace(" added", "");
    return t && t.kind === "seconds" ? v + " s" : String(v);
  }
  function teenBelt(level) {
    var b = window.CLUB_BELTS.belts.filter(function (x) { return level >= x[0]; }).pop();
    return { belt: b[1], emoji: b[2], stripes: b[3].filter(function (m) { return level >= m; }).length };
  }
  function teenPlace(key, tests) {
    var R = window.CLUB_BELTS, d = R.disciplines[key], level = 1, source = null, maybe = null, nxt = null;
    for (var i = 0; i < R.levels[key].length; i++) {
      var L = R.levels[key][i];
      var checks = L.tests.map(function (t) {
        var answered = t.opts.filter(function (o) { return teenValue(o[0], tests) != null; });
        var hit = answered.filter(function (o) { return teenMet(teenValue(o[0], tests), o[1]); })[0], show = hit || answered[0];
        return { test: t.text, yours: show ? teenYours(show[0], teenValue(show[0], tests)) : null, status: hit ? "met" : answered.length ? "not_yet" : "not_answered" };
      });
      var st = checks.map(function (c) { return c.status; });
      if (st.every(function (x) { return x === "met"; })) { level = L.level; source = L.source; continue; }
      if (st.indexOf("not_yet") === -1 && st.indexOf("met") !== -1) maybe = L.level;
      nxt = { level: L.level, source: L.source, note: R.notes[L.source], belt_test: L.belt_test, unclear: L.unclear, belt: L.belt, emoji: L.emoji, stripes: L.stripes, tests: checks };
      break;
    }
    var b = teenBelt(level);
    return { key: key, name: d.name, animal: d.animal, animal_emoji: d.emoji, level: level, belt: b.belt, emoji: b.emoji, stripes: b.stripes,
      source: source, note: source ? R.notes[source] : null, maybe: maybe, next: nxt, top: level >= R.top };
  }
  function teenResult() {
    var tests = clubTests(), D = window.CLUB_BELTS.disciplines;
    return { teen: true, club: { skool_url: K.skool_url, belts: Object.keys(D).filter(function (k) { return ticked(D[k].skill); }).map(function (k) { return teenPlace(k, tests); }) } };
  }
  if (preview) window.__teenResult = teenResult;

  function form() {
    var answers = { age: parseInt(s.age, 10) };
    var w = weightLb(), hi = heightIn(), r = runSecs(), lifts = liftList(), j = jumpIn();
    if (w != null) answers.bodyweight_lb = w;
    if (hi) answers.height_in = hi;
    if (s.shirt) answers.shirt_size = s.shirt;
    if (s.muscle) answers.muscle = s.muscle;
    if (!s.skipped.strength && s.pushups !== "") answers.pushups = parseInt(s.pushups, 10);
    if (!s.skipped.strength && s.pullups !== "") answers.pullups = parseInt(s.pullups, 10);
    if (r) answers.run = { distance: s.runDist, seconds: r };
    if (lifts.length && w != null) answers.lifts = lifts;
    if (j) answers.broad_jump_in = j;
    answers.club = { skills: Object.keys(s.skills), tests: clubTests() };
    var f = { first_name: s.name.trim(), adult: s.adult, way_in: s.way, agreed: s.agreed, consent_version: C.consent_version,
      consent_method: "web_link", sex: s.sex, answers: answers };
    if (s.way === "describe") f.description = Object.assign({}, s.look, { extra: (s.look.extra || "").trim() });
    if (s.way === "selfie") f.face_release = { signed_name: s.signedName.trim() };
    if (!s.skipped.skill && s.skill.trim()) f.skill_text = s.skill.trim();
    var sk = {}; Object.keys(s.sk).forEach(function (k) { if (s.sk[k].trim()) sk[k] = s.sk[k].trim(); });
    if (!s.skipped.skill && f.skill_text && Object.keys(sk).length) f.skill_details = sk;
    if (s.note.trim()) f.drawing_note = s.note.trim();
    return f;
  }
  // Preview only (no link): hooks for checking the page's answers and a real result card before it goes live.
  if (preview) { window.__clubForm = form; window.__showResult = function (r) { s.result = r; s.done = true; render(); window.scrollTo(0, 0); }; }

  function send() {
    if (s.teen) { s.result = teenResult(); s.done = true; render(); window.scrollTo(0, 0); return; }
    if (preview) { s.done = true; render(); window.scrollTo(0, 0); return; }
    s.sending = true; s.error = ""; bar();
    var body = new URLSearchParams({ token: token, form: JSON.stringify(form()) });
    if (s.way === "selfie" && s.selfie) body.set("selfie", s.selfie.b64);
    fetch(ENDPOINT, { method: "POST", body: body }).then(function (r) { return r.json(); }).then(function (reply) {
      s.sending = false;
      if (reply && reply.ok) { s.done = true; sentAt(Date.now()); rerenderAtReady(); setTimeout(checkResult, 30000); } else { s.error = (reply && reply.error) || "That didn't send. Please try again."; }
      render(); window.scrollTo(0, 0);
    }).catch(function () { s.sending = false; s.error = "That didn't send. Check your connection and try again."; render(); });
  }

  if (WIDE.addEventListener) WIDE.addEventListener("change", render); else WIDE.addListener(render);
  if (!C || !K) { document.getElementById("main").textContent = "This page didn't load properly. Please reload it."; return; }
  render();
  checkResult();
})();
