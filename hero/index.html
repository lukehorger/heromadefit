      case "age": return [head("How old are you?", "We compare you with people your age."), num("age", "Age", "years", { max: 3 })];

        return [head("How tall are you?", "This helps us draw your hero at the right height."),
          h("div", { class: "pair" }, [num("hFt", "Feet", "ft", { max: 1, onfill: function () { var n = document.querySelectorAll(".pair input")[1]; if (s.hFt && n) n.focus(); } }),
            num("hIn", "Inches", "in", { max: 2 })])];
      case "pushups": return [head("Max push-ups", "Your most full push-ups in one set: in a row, chest to the floor, without stopping. Not a total across sets."), num("pushups", "Push-ups", "reps", { max: 3 })];
      case "pullups": return [head("Max pull-ups", "Your most strict pull-ups in one set: in a row from a dead hang, chin over the bar. Not a total across sets."), num("pullups", "Pull-ups", "reps", { max: 3 })];
      case "run":
        return [head("How fast could you run today?", "A mile or a 5K: your fastest in the past year, or your best guess for today, not a time from years ago. An estimate is fine. Skip it if you don't know."),
          seg(c.runs, function () { return s.runDist; }, function (v) { s.runDist = v; }),
          h("div", { class: "pair" }, [num("runMin", "Minutes", "min", { max: 3 }), num("runSec", "Seconds", "sec", { max: 2 })])];
      case "lifts":
        var rows = c.lifts.map(function (l, i) {

          function step(dv) { return function () { s.reps[l.key] = Math.max(1, Math.min(30, (s.reps[l.key] || 1) + dv)); render(); }; }
          var kit = seg([{ key: "bar", name: "Barbell" }, { key: "db", name: "Dumbbells" }], function () { return s.db[l.key] ? "db" : "bar"; },

          return h("div", {}, [h("div", { class: "label", text: l.name }), kit, h("div", { style: "height:8px" }),
            h("div", { class: "field" }, [inp, h("span", { class: "unit", text: s.db[l.key] ? "lb each dumbbell" : "lb" })]), h("div", { class: "stepper" }, [count, h("div", {}, [h("button", { type: "button", text: "−", onclick: step(-1), "aria-label": "Fewer reps" }),
            h("button", { type: "button", text: "+", onclick: step(1), "aria-label": "More reps" })])])]);

        return [head("Your best lifts", "Your heaviest set with good form: the weight, and how many reps you did in that one set (not a total across sets). For example, 95 lb for 10 reps. For dumbbells, tap Dumbbells and enter the weight of one. Fill in any you know and leave the rest blank.")].concat(rows,
          [liftList().length && weightLb() == null ? h("p", { class: "note gold", text: "Lifts are measured for your size, so go back and add your bodyweight, or skip the lifts." }) : null]);

        return [head("Standing broad jump", "Your longest jump from standing still, both feet. Skip it if you don't know."),

          h("div", {}, [h("div", { class: "label", text: "Your skill" }), h("div", { class: "field" }, [ta])]),
          h("p", { class: "note", text: "For example: \"BJJ blue belt, 4 years\", \"Tennis league every week for 3 years, I win about half my matches\", \"I climb V4 at the gym\", or \"I swim 1 mile in 40 minutes\". An AI reads it and scores it." })];
      case "review":
        var lifts = liftList(), hi = heightIn(), j = jumpIn(), r = runSecs(), runName = (c.runs.filter(function (x) { return x.key === s.runDist; })[0] || {}).name;
        function row(k, v) { return [h("dt", { text: k }), h("dd", { text: v })]; }
        var dl = h("dl", { class: "review" }, [].concat(

          row("Body", [s.sex === "male" ? "Male" : "Female", s.shirt ? "shirt " + s.shirt : null, s.muscle ? s.muscle.toLowerCase() : null].filter(Boolean).join(", ")),

          row("Age", s.age), row("Bodyweight", weightLb() != null ? weightLb() + " lb" : "skipped"),
          row("Height", hi ? Math.floor(hi / 12) + " ft " + (hi % 12) + " in" : "skipped"),
          row("Push-ups", s.skipped.pushups || s.pushups === "" ? "skipped" : s.pushups), row("Pull-ups", s.skipped.pullups || s.pullups === "" ? "skipped" : s.pullups),

          row("Lifts", lifts.length ? lifts.map(function (l) { return (c.lifts.filter(function (x) { return x.key === l.exercise; })[0] || {}).name + " " + (l.dumbbells ? "2 × " + l.weight_lb / 2 + " lb dumbbells" : l.weight_lb + " lb") + " × " + l.reps; }).join("\n") : "skipped"),

        return [head("Ready, " + s.name.trim() + "?", "Your results are one tap away."), h("div", { class: "win" }, [h("h2", { text: "SUMMARY" }), dl]),

  }

  function doneScreen() {
    if (s.result) return resultScreen();
    return [head("Your hero is being forged", preview ? "Preview: nothing was sent. Tap below to see what the result looks like." :
        "The System is reading your answers. Your result shows up right here, on this same link, usually within a day."),
      preview ? h("button", { type: "button", class: "btn-file", text: "Preview the result screen", onclick: function () { s.result = SAMPLE; render(); } }) : null,
      h("div", { class: "hex", text: "?" }),
      h("div", { class: "win" }, [h("h2", { text: "SYSTEM" }), h("div", { text: "Your stats: strength, endurance, agility and skill. Your rank is set from these, and your anime hero is drawn from your " +
        (s.way === "selfie" ? "selfie." : "description.") })]),

  }

  var SAMPLE = { first_name: "Sample", rank: "D", power: 31, avatar_status: "queued", stats: [
    { key: "STR", name: "Strength", value: 34, rank: "D", in_rank: true, parts: [{ name: "Push-ups", measured: "25 in a row", percentile: "about the 72nd percentile for men 25–34" }] },
    { key: "END", name: "Endurance", value: 28, rank: "D", in_rank: true, parts: [{ name: "Aerobic engine", measured: "5K in 26:00 → VO2 max about 38 (estimated)", percentile: "below the 50th percentile for men 25–34" }] },
    { key: "AGI", name: "Agility", value: 0, rank: "–", in_rank: false, summary: "Speed and explosiveness. Not answered, so it doesn't count toward the rank.", parts: [] },
    { key: "SKL", name: "Skill", value: 40, rank: "C", in_rank: true, parts: [{ name: "Brazilian jiu-jitsu", measured: "BJJ blue belt", percentile: "A blue belt takes real time and effort to earn, which puts you ahead of most people who train." }] }] };

  function resultScreen() {
    var r = s.result, kids = [];
    kids.push(head(r.first_name + ", here's your hero", "Where you are now, and your next step up for each stat."));
    var rows = r.stats.filter(function (x) { return x.key !== "VIT"; }).map(function (x) {
      var na = !x.in_rank, part = (x.parts || [])[0];
      var els = [h("b", { text: x.key }), h("span", { class: "nm", text: x.name.toUpperCase() }), h("span", { class: "rk", text: na ? "" : x.rank }),

      els.push(h("div", { class: "why", text: na ? (x.unlock || "No answers for this one, so it doesn't count toward your rank.") :
        x.key === "SKL" && part ? part.name + ": " + part.percentile + " (estimated by AI from your description)" :
        (x.parts || []).map(function (q) { return q.name + ": " + q.measured + (q.percentile ? " · " + q.percentile : ""); }).join("\n") }));

    else kids.push(h("div", { class: "win" }, [h("h2", { text: "YOUR HERO" }), h("div", { text: "Your hero art is being drawn. It shows up here when it's ready." })]));

  }

  function feedbackBox() {
    var f = s.fb;
    if (f.sent) return h("div", { class: "win" }, [h("h2", { text: "FEEDBACK" }), h("div", { text: "Thanks! Luke reads every one." })]);
    function rb(key, label) { return h("button", { type: "button", class: "big" + (f.rating === key ? " on" : ""), text: label, onclick: function () { f.rating = f.rating === key ? null : key; render(); } }); }

  function post(fields) {
    return fetch(ENDPOINT, { method: "POST", body: new URLSearchParams(Object.assign({ token: token }, fields)) }).then(function (r) { return r.json(); });
  }

  function sendFeedback() {
    var f = s.fb;

  function loadAvatar(n) {

  // A used link becomes the person's results page: check for a result now, and every 30 s while they wait.
  function checkResult() {

  function toJpeg(file) {

  function form() {
